<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#101b36" />
  <title>りすぺく島RPG Ver.0.34</title>
  <link rel="stylesheet" href="styles.css" />



<style>
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  overflow-x:hidden;
  background:#07122c;
}
body{
  padding:0 !important;
}
canvas{
  display:block;
  max-width:100%;
}
@media (orientation:landscape) and (max-height:600px){
  canvas{
    width:auto !important;
    height:calc(100dvh - 4px) !important;
    max-width:100vw !important;
    margin:0 auto !important;
  }
}
</style>

<style>
#actionBtn{
  pointer-events:auto !important;
  touch-action:manipulation !important;
  z-index:30 !important;
}
#touchUI{
  pointer-events:none;
}
#touchUI #stickBase,
#touchUI #actionBtn{
  pointer-events:auto;
}
</style>
</head>
<body>
  <main id="app">
    <canvas id="game" width="960" height="540" aria-label="りすぺく島RPG"></canvas>

    <div id="rotateNotice">
      <div>📱</div>
      <strong>スマホを横向きにすると遊びやすいです</strong>
    </div>


    <div id="nameOverlay" class="hidden">
      <div class="namePanel">
        <div class="nameTitle">主人公の名前を決めてください</div>
        <input id="nameInput" maxlength="8" value="リク" autocomplete="off" />
        <button id="nameOk">この名前で決定</button>
        <div class="nameHint">※ 8文字まで</div>
      </div>
    </div>

    <div id="touchUI" class="hidden">
      <div id="stickBase">
        <div id="stickKnob"></div>
      </div>
      <button id="actionBtn" aria-label="決定">A</button>
    </div>
  </main>
  <script src="game.js?v=034"></script>
</body>
</html>
